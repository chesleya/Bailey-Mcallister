media:
  input: images
  output: images

content:
  - name: gallery
    label: Projects & photos
    type: file
    path: content/gallery.json
    fields:
      - name: projects
        label: Projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Project name
            description: e.g. Ross Classic. Drag projects or photos by the handle on the left to reorder.
            type: string
            required: true
          - name: photos
            label: Photos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{caption}"
            fields:
              - name: image
                label: Photo
                description: Any size is fine. Big files are shrunk automatically a few minutes after saving.
                type: image
                required: true
              - name: caption
                label: Caption
                description: One short line about the room (optional)
                type: string

  - name: site
    label: Page text & details
    type: file
    path: content/site.json
    fields:
      - name: tagline
        label: Home page tagline
        type: string
      - name: about_photo
        label: About page photo
        type: image
      - name: about_text
        label: About page text
        description: Leave a blank line between paragraphs.
        type: text
      - name: contact_text
        label: Contact page text
        type: text
      - name: email
        label: Email address
        description: Used on the Contact page and in the footer.
        type: string
      - name: location
        label: Location (footer)
        type: string
      - name: instagram
        label: Instagram link
        type: string
