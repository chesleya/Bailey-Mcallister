name: Tidy photos

# Runs whenever photos or page content change (e.g. Bailey saves in Pages CMS).
on:
  push:
    branches: [main]
    paths: ["images/**", "content/**", "*.html"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# One run at a time, so several quick uploads don't trip over each other.
concurrency:
  group: tidy-photos
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow pillow-heif

      - run: python .github/scripts/photos.py

      - name: Save changes
        id: commit
        run: |
          git config user.name "photo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images content *.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Tidy photos (resize and grid copies)"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits made by this workflow don't always republish the site on their own, so ask for it.
      - name: Republish site
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
